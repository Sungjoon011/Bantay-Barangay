<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bantay-Barangay | Staff Portal</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="/seal.png">
</head>
<body>
<div id="alert"></div>
<header>
  <div class="brand">
    <div class="logo"></div>
    <b>Bantay-Barangay Staff Portal</b>
  </div>
  <span id="who" class="mu"></span>
</header>

<main>
<!-- SIGN IN CARD -->
<section id="login" class="card" style="max-width: 440px; margin: 40px auto; padding: 28px;">
  <div style="text-align: center; margin-bottom: 20px;">
    <img class="seal-lg" src="/seal.png" alt="Bantay Barangay seal">
    <h2 style="margin: 0; font-size: 20px;">Staff Sign In</h2>
    <p class="mu" style="margin-top: 4px; font-size: 13px;">Official LGU Administrative Portal</p>
  </div>
  <form id="lf" style="display: flex; flex-direction: column; gap: 12px;">
    <div>
      <label>Email Address</label>
      <input id="em" value="admin2@barangay.com" placeholder="staff@barangay.gov.ph" style="width: 100%;">
    </div>
    <div>
      <label>Password</label>
      <input id="pw" type="password" placeholder="••••••••" style="width: 100%;">
    </div>
    <button style="margin-top: 8px; padding: 11px;">Access System</button>
  </form>
  <hr style="border: 0; border-top: 1px solid var(--ln); margin: 20px 0 16px;">
  <p class="mu" style="margin: 0; text-align: center; font-size: 12px;">
    Public Services: <a href="/resident.html">Resident Portal</a> · <a href="/verify.html">Verify Document</a>
  </p>
</section>

<!-- MAIN APP DASHBOARD -->
<section id="app" class="hide">
  <nav id="nav"></nav>
  <div id="view"></div>
</section>
</main>

<div id="toast"></div>

<script src="qrcode.js"></script>
<script src="announce-popup.js"></script>
<script>
(function(){'use strict';
var token=null,role=null,uid=null,$=function(i){return document.getElementById(i)};
function h(t,a,k){var e=document.createElement(t);a=a||{};Object.keys(a).forEach(function(n){if(n==='on')Object.keys(a.on).forEach(function(v){e.addEventListener(v,a.on[v])});else if(n==='text')e.textContent=a.text;else e.setAttribute(n,a[n])});(k||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function say(m,ok){var t=$('toast');t.textContent=m;t.style.background=ok?'var(--ok)':'var(--bad)';t.style.display='block';setTimeout(function(){t.style.display='none'},3500)}
function api(m,p,b){var o={method:m,headers:{'Content-Type':'application/json'}};if(token)o.headers.Authorization='Bearer '+token;if(b)o.body=JSON.stringify(b);
 return fetch('/api'+p,o).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})})}
function done(okMsg,again){return function(r){say(r.ok?okMsg:(r.d.error||'Error'),r.ok);if(r.ok&&again)again()}}
function bcls(v){v=String(v);return /^(Claimed|Resolved|Paid|Active|Attended|Approved)/.test(v)?'b-ok':/^(Pending|Open|Unpaid|Registered|Upcoming)/.test(v)?'b-warn':/^(Processing|Ongoing|Ready)/.test(v)?'b-info':/^(Rejected|Cancelled|Banned|NoShow)/.test(v)?'b-bad':'b-mu'}
function table(rows,cols,act){var t=h('table'),hr=h('tr');cols.forEach(function(c){hr.appendChild(h('th',{text:c[0]}))});if(act)hr.appendChild(h('th'));t.appendChild(hr);
 rows.forEach(function(r){var tr=h('tr');cols.forEach(function(c){var v=c[1](r),td=h('td');if(c[0]==='Status'||c[0]==='Payment')td.appendChild(h('span',{class:'badge '+bcls(v),text:v}));else td.textContent=v;tr.appendChild(td)});if(act){var td=h('td');act(r).forEach(function(b){td.appendChild(b)});tr.appendChild(td)}t.appendChild(tr)});
 if(!rows.length)t.appendChild(h('tr',{},[h('td',{text:'Nothing here yet.',class:'mu'})]));return h('div',{class:'tw'},[t])}
function form(fields,label,fn){var f=h('form');fields.forEach(function(x){var i;if(x[2]==='select'){i=h('select',{name:x[0]});x[3].forEach(function(o){i.appendChild(h('option',{value:o[0],text:o[1]}))})}else if(x[2]==='textarea')i=h('textarea',{name:x[0],rows:'3'});else i=h('input',{name:x[0],type:x[2]||'text'});f.appendChild(h('div',{},[h('label',{text:x[1]}),i]))});
 f.appendChild(h('button',{text:label}));f.addEventListener('submit',function(e){e.preventDefault();var d={};fields.forEach(function(x){d[x[0]]=f.elements[x[0]].value});fn(d,f)});return f}
function card(t,k){return h('div',{class:'card'},[h('h3',{text:t})].concat(k))}
function btn(t,fn,c){return h('button',{text:t,class:c||'alt',on:{click:fn}})}
function opts(rows,v,l){return rows.map(function(r){return[r[v],l(r)]})}
function nm(r){return r?r.firstName+' '+r.lastName:''}
function date(v){return v?String(v).slice(0,10):''}

// LOGIN
$('lf').addEventListener('submit',function(e){e.preventDefault();api('POST','/login',{email:$('em').value,password:$('pw').value}).then(function(r){
 if(!r.ok){say(r.d.error||'Login failed');return}token=r.d.token;var p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));role=p.role;uid=p.accountId;
 $('login').classList.add('hide');$('app').classList.remove('hide');
 var o=h('button',{text:'Log out',class:'alt',on:{click:function(){location.reload()}}}),adv=h('a',{href:'/console.html',text:'Advanced Console ',class:'mu',style:'margin-right:10px; font-weight:600;'});
 $('who').textContent=$('em').value+' · '+role+' ';$('who').appendChild(adv);$('who').appendChild(o);nav();show('home');banner()})});
var bannerTimer=null;
function banner(){if(!bannerTimer)bannerTimer=setInterval(banner,60000); // new announcements pop up without a refresh
 api('GET','/announcements').then(function(r){if(!r.ok)return;var a=r.d.filter(function(x){return x.priority==='Emergency'})[0];if(a){$('alert').style.display='block';$('alert').textContent='EMERGENCY: '+a.title+' - '+a.messageBody}
  // pop-up for Important / Emergency announcements addressed to everyone (staff portal only pops the "Everyone" ones)
  if(window.announcePopup)announcePopup({userKey:'staff'+uid,list:r.d,accept:function(x){return String(x.targetAudience||'All').toLowerCase()==='all'}})})}

// NAVIGATION
var MENU={Admin:['home','residents','documents','payments','blotters','announcements','reports','staff','fees','audit'],Staff:['home','residents','documents','payments','blotters','announcements','reports','staff'],Official:['home','documents','payments','blotters','announcements','reports','staff','audit']};
var NAMES={home:'Dashboard',residents:'Resident Directory',documents:'Document Requests',payments:'Payments & Revenue',blotters:'Incident Blotter',announcements:'Announcements',reports:'Analytics & Reports',staff:'Staff Accounts',fees:'Fee Structure',audit:'Audit Logs'};
function label(k){return k==='staff'&&role!=='Admin'?'My Account':NAMES[k]}
function nav(){var n=$('nav');n.textContent='';MENU[role].forEach(function(k){n.appendChild(h('button',{text:label(k),'data-k':k,on:{click:function(){show(k)}}}))})}
function show(k){Array.prototype.forEach.call($('nav').children,function(b){b.className=b.getAttribute('data-k')===k?'on':''});var v=$('view');v.textContent='';v.appendChild(h('h2',{text:label(k)}));VIEWS[k](v)}

// SHARED
function docActions(r,again){var b=[];var paid=r.payment&&r.payment.paymentStatus==='Paid';
 function step(s){return function(){api('PATCH','/documents/'+r.requestId+'/process',{newStatus:s}).then(done('Updated to '+s,again))}}
 if(r.status==='Pending')b.push(btn('Start Processing',step('Processing'),''),btn('Reject',step('Rejected'),'bad'));
 if(r.status==='Processing')b.push(btn('Mark Ready',step('Ready'),''),btn('Reject',step('Rejected'),'bad'));
 if(r.status==='Ready'&&!paid)b.push(btn('Record Payment',function(){var o=prompt('Official Receipt (OR) Number:','OR-');if(o)api('PATCH','/documents/'+r.requestId+'/payment',{orNumber:o}).then(done('Payment recorded',again))},''));
 if(r.status==='Ready'&&paid)b.push(btn('Release Document',step('Claimed'),''));
 if(r.status==='Ready'||r.status==='Claimed')b.push(btn('Print Certificate',function(){printDoc(r)}));return b}

function verifyUrl(code){return location.origin+'/verify.html?code='+encodeURIComponent(code)}
function qrSvg(t){var q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}
function printDoc(r){var w=window.open('','_blank'),seal=esc(location.origin)+'/seal.png';w.document.write('<title>Official Barangay Certificate</title><body style="font-family:Georgia,serif;text-align:center;padding:60px;margin:0"><img src="'+seal+'" alt="" style="position:fixed;top:50%;left:50%;width:560px;height:560px;margin:-280px 0 0 -280px;opacity:.10;z-index:0;-webkit-print-color-adjust:exact;print-color-adjust:exact"><div style="position:relative;z-index:1"><img src="'+seal+'" alt="Bantay Barangay seal" style="width:96px;height:96px;display:block;margin:0 auto 8px"><p>Republic of the Philippines</p><h2>OFFICE OF THE BARANGAY CAPTAIN</h2><h1>'+esc(r.documentType)+'</h1><p>This is to certify that <b>'+esc(nm(r.resident))+'</b> is a bona fide resident of this barangay.</p><p>Purpose: '+esc(r.purpose)+'</p><div style="margin-top:40px;text-align:center">'+(r.verificationCode?'<div style="width:104px;height:104px;margin:0 auto">'+qrSvg(verifyUrl(r.verificationCode))+'</div><div style="font-size:10px">Scan to verify</div>':'')+'<p>Verification Code: <b>'+esc(r.verificationCode)+'</b><br>Verify at '+esc(location.origin)+'/verify.html</p></div></div>');w.document.close();var t0=Date.now();(function wait(){var ok=true,im=w.document.images;for(var i=0;i<im.length;i++)if(!im[i].complete)ok=false;if(ok||Date.now()-t0>4000){w.focus();w.print()}else setTimeout(wait,100)})()}
function docTable(rows,again){return table(rows,[['#',function(r){return r.requestId}],['Resident',function(r){return nm(r.resident)}],['Document',function(r){return r.documentType}],['Status',function(r){return r.status}],['Payment',function(r){return r.payment?r.payment.paymentStatus+' (₱'+r.payment.amount+')':'-'}],['Code',function(r){return r.verificationCode||''}]],function(r){return docActions(r,again)})}
function stats(v){api('GET','/stats').then(function(r){if(!r.ok)return;var g=h('div',{class:'stats'}),n={active_residents:'Active Residents',pending_documents:'Pending Clearances',open_blotters:'Open Blotter Cases',unpaid_payments:'Unpaid Fees',senior_citizens:'Senior Citizens'};
 Object.keys(n).forEach(function(k){g.appendChild(h('div',{class:'stat'},[h('b',{text:r.d[k]}),n[k]]))});v.insertBefore(g,v.children[1]||null)})}
function blotterTable(rows,again){return table(rows,[['#',function(r){return r.caseId}],['Date',function(r){return date(r.dateOfIncident)}],['Type',function(r){return r.incidentType}],['Complainant',function(r){return nm(r.complainant)}],['Against',function(r){return r.respondentName}],['Status',function(r){return r.status}]],function(r){return['Open','Ongoing','Resolved'].filter(function(s){return s!==r.status}).map(function(s){return btn('Set '+s,function(){api('PATCH','/blotters/'+r.caseId+'/status',{status:s}).then(done('Case '+s,again))})})})}

// VIEWS
var VIEWS={
 home:function(v){
  // USER FRIENDLY WELCOME BANNER
  var welcomeCard = h('div', {class: 'card welcome-banner'}, [
    h('div', {style: 'display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap: 12px;'}, [
      h('div', {}, [
        h('h3', {text: 'Good day! Ready for today\'s barangay requests?', style: 'margin:0 0 4px; font-size:18px;'}),
        h('p', {text: 'Use the quick action buttons below or select a section from the navigation menu.', class: 'mu', style: 'margin:0; font-size:13px;'})
      ]),
      h('div', {class: 'row'}, [
        btn('New Document', function(){ show('documents'); }),
        btn('File Blotter', function(){ show('blotters'); }, 'alt')
      ])
    ])
  ]);
  v.appendChild(welcomeCard);
  stats(v);

  if(role==='Official'){
    var c1=card('Business Permits Pending Approval',[]),c2=card('Active Incident Blotters',[]);v.appendChild(c1);v.appendChild(c2);
    api('GET','/permits').then(function(r){c1.appendChild(table((r.d||[]).filter(function(p){return p.status==='Pending'}),[['Business',function(p){return p.businessName}],['Owner',function(p){return nm(p.resident)}],['Applied',function(p){return date(p.applicationDate)}]],function(p){return['Approved','Rejected'].map(function(s){return btn(s,function(){api('PATCH','/permits/'+p.permitId+'/status',{status:s}).then(done('Permit '+s,function(){show('home')}))},s==='Rejected'?'bad':'')})}))});
    api('GET','/blotters').then(function(r){c2.appendChild(blotterTable((r.d||[]).filter(function(b){return b.status!=='Resolved'}),function(){show('home')}))});return
  }
  var c=card('Active Document Processing Queue',[]);v.appendChild(c);api('GET','/documents').then(function(r){c.appendChild(docTable((r.d||[]).filter(function(d){return d.status!=='Claimed'&&d.status!=='Rejected'}),function(){show('home')}))})
 },
 residents:function(v){var list=card('Registered Barangay Residents',[]);
  api('GET','/households').then(function(h1){var hh=h1.d||[];
   v.appendChild(card('Add Household Record',[form([['addressDetails','House No. & Street'],['purokZone','Purok / Zone']],'Register Household',function(d){api('POST','/households',d).then(done('Household added',function(){show('residents')}))})]));
   v.appendChild(card('Add Resident Record',[form([['householdId','Household Address','select',opts(hh,'householdId',function(x){return x.addressDetails+' ('+x.purokZone+')'})],['firstName','First Name'],['lastName','Surname'],['birthDate','Birth Date','date'],['gender','Gender','select',[['Male','Male'],['Female','Female'],['Other','Other']]],['civilStatus','Civil Status','select',[['Single','Single'],['Married','Married'],['Widowed','Widowed']]],['contactNumber','Mobile No.']],'Register Resident',function(d){api('POST','/residents',d).then(done('Resident added',function(){show('residents')}))})]));
   v.appendChild(list);api('GET','/residents').then(function(r){list.appendChild(table(r.d||[],[['#',function(x){return x.residentId}],['Name',nm],['Birth Date',function(x){return date(x.birthDate)}],['Household Address',function(x){return x.household?x.household.addressDetails+', '+x.household.purokZone:''}],['Mobile No.',function(x){return x.contactNumber||''}],['Status',function(x){return x.recordStatus}]]))})})
 },
 documents:function(v){api('GET','/residents').then(function(rs){api('GET','/fees').then(function(fs){
   v.appendChild(card('Create New Document Request',[form([['residentId','Select Resident','select',opts(rs.d||[],'residentId',nm)],['documentType','Document Type','select',opts(fs.d||[],'documentType',function(x){return x.documentType+' (₱'+x.fee+')'})],['purpose','Request Purpose']],'Submit Request',function(d){api('POST','/documents',d).then(done('Request created',function(){show('documents')}))})]));
   var c=card('All Clearance & Certificate Requests',[]);v.appendChild(c);api('GET','/documents').then(function(r){c.appendChild(docTable(r.d||[],function(){show('documents')}))})})})
 },
 payments:function(v){var c=card('Payment Transactions History',[]);v.appendChild(c);api('GET','/payments').then(function(r){var rows=r.d||[],tot=rows.filter(function(p){return p.paymentStatus==='Paid'}).reduce(function(a,p){return a+Number(p.amount)},0);
  c.appendChild(h('p',{text:'Total Revenue Collected: ₱'+tot.toLocaleString()+' · Payments recorded upon settlement at the Barangay Treasury.', class:'mu'}));
  c.appendChild(table(rows,[['#',function(p){return p.paymentId}],['Transaction',function(p){return p.requestId?'Document Request #'+p.requestId:'Permit Application #'+p.permitId}],['Amount',function(p){return '₱'+p.amount}],['Status',function(p){return p.paymentStatus}],['OR Number',function(p){return p.orNumber||''}],['Payment Method',function(p){return p.paymentMethod||''}],['Paid Date',function(p){return date(p.datePaid)}]],
   function(p){return p.paymentStatus==='Unpaid'&&p.requestId?[btn('Collect Fee',function(){var o=prompt('Official Receipt (OR) Number:','OR-');if(!o)return;var m=prompt('Method (Cash, GCash, Maya):','Cash');api('PATCH','/documents/'+p.requestId+'/payment',{orNumber:o,method:m||'Cash'}).then(done('Payment recorded',function(){show('payments')}))},'')]:[]}))})
 },
 blotters:function(v){api('GET','/residents').then(function(rs){api('GET','/staff').then(function(st){var me=(st.d||[]).filter(function(a){return a.accountId===uid&&a.staffProfile})[0];
   v.appendChild(card('File Official Incident Blotter',[form([['complainantResidentId','Complainant','select',opts(rs.d||[],'residentId',nm)],['respondentName','Respondent / Person Involved'],['incidentType','Incident Category'],['dateOfIncident','Date of Incident','date'],['description','Incident Narrative']],'File Incident Case',function(d){d.recordedByStaffId=me?me.staffProfile.staffId:null;api('POST','/blotters',d).then(done('Blotter case filed',function(){show('blotters')}))})]));
   var c=card('Barangay Incident Cases',[]);v.appendChild(c);api('GET','/blotters').then(function(r){c.appendChild(blotterTable(r.d||[],function(){show('blotters')}))})})})
 },
 reports:function(v){function bars(t,rows,k,val){var m={};rows.forEach(function(r){m[r[k]]=(m[r[k]]||0)+Number(r[val])});var ks=Object.keys(m),mx=Math.max.apply(null,ks.map(function(x){return m[x]}).concat([1]));
   var c=card(t,[]);ks.forEach(function(x){c.appendChild(h('div',{class:'bar'},[h('span',{text:x}),h('i',{style:'width:'+Math.round(m[x]/mx*60)+'%'}),String(m[x])]))});if(!ks.length)c.appendChild(h('p',{text:'No data recorded.',class:'mu'}));v.appendChild(c)}
  [['population','Resident Distribution per Purok','purok','residents'],['incidents','Reported Incidents by Type','incident_type','total'],['requests','Clearance Requests by Document Type','document_type','total'],['revenue','Monthly Barangay Collections (₱)','period','collected']].forEach(function(x){api('GET','/reports/'+x[0]).then(function(r){bars(x[1],r.d||[],x[2],x[3])})})
 },
 staff:function(v){
  // Staff / Official: only their OWN account (the server returns just that row). Only an Admin adds or removes staff.
  if(role!=='Admin'){
   var me=card('My Account',[]);v.appendChild(me);
   api('GET','/staff').then(function(r){var a=(r.d||[])[0];if(!a){me.appendChild(h('p',{text:'Account not found.',class:'mu'}));return}
    var p=a.staffProfile||{};
    me.appendChild(h('p',{text:a.email+' · '+a.systemRole+' · '+a.accountStatus,class:'mu'}));
    var f=form([['firstName','First Name'],['lastName','Surname'],['positionTitle','Position / Title']],'Save My Details',function(d){api('PUT','/staff/'+a.accountId,d).then(done('Details saved',function(){show('staff')}))});
    f.elements.firstName.value=p.firstName||'';f.elements.lastName.value=p.lastName||'';f.elements.positionTitle.value=p.positionTitle||'';
    me.appendChild(f);
    me.appendChild(h('p',{text:'Only an Admin can add or remove staff accounts.',class:'mu'}))});
   return}
  v.appendChild(card('Create Staff Account',[form([['email','Email Address'],['password','Password','password'],['systemRole','System Role','select',[['Staff','Staff'],['Official','Official'],['Admin','Admin']]],['firstName','First Name'],['lastName','Surname'],['positionTitle','Position / Title']],'Create Account',function(d){api('POST','/staff',d).then(done('Staff account created',function(){show('staff')}))})]));
  var c=card('Staff & Official Accounts',[]);v.appendChild(c);api('GET','/staff').then(function(r){c.appendChild(table(r.d||[],[['Email',function(a){return a.email}],['Role',function(a){return a.systemRole}],['Name',function(a){return nm(a.staffProfile)}],['Position',function(a){return a.staffProfile?a.staffProfile.positionTitle:''}],['Status',function(a){return a.accountStatus}]],function(a){
    if(a.accountStatus!=='Active')return[btn('Reactivate',function(){api('PUT','/staff/'+a.accountId,{accountStatus:'Active'}).then(done('Account reactivated',function(){show('staff')}))},'')];
    if(a.accountId===uid)return[];
    return[btn('Remove',function(){if(confirm('Remove '+(nm(a.staffProfile)||a.email)+'? They will no longer be able to log in.'))api('DELETE','/staff/'+a.accountId).then(done('Staff account removed',function(){show('staff')}))},'bad')]}))})
 },
 announcements:function(v){
  // Everyone: all accounts (staff + residents) | All residents | one purok. Staff / Official can edit or delete only their own posts.
  var audLabel=function(a){return a==='All'?'Everyone (all accounts)':a==='Residents'?'All residents':a};

   var seen={};(hh.d||[]).forEach(function(x){if(x.purokZone)seen[x.purokZone]=1});
   var aud=[['All','Everyone - all accounts (staff and residents)'],['Residents','All residents']].concat(Object.keys(seen).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})}).map(function(p){return[p,'Only '+p]}));
   v.appendChild(card('Post Announcement',[form([['title','Title'],['messageBody','Message','textarea'],['targetAudience','Who should see it?','select',aud],['priority','Priority','select',[['Normal','Normal'],['Important','Important'],['Emergency','Emergency (red banner for 3 days)']]]],'Post Announcement',function(d){api('POST','/announcements',d).then(done('Announcement posted',function(){show('announcements')}))})]));
   var c=card('Announcements',[]);v.appendChild(c);
   api('GET','/announcements').then(function(r){c.appendChild(table(r.d||[],[['Date',function(a){return date(a.datePosted)}],['Title',function(a){return a.title}],['Message',function(a){return a.messageBody}],['For',function(a){return audLabel(a.targetAudience)}],['Priority',function(a){return a.priority}],['Posted by',function(a){return a.postedByName||''}]],function(a){

            btn('Delete',function(){if(confirm('Delete this announcement?'))api('DELETE','/announcements/'+a.announcementId).then(done('Announcement deleted',function(){show('announcements')}))},'bad')]}))})})
 },
 fees:function(v){var c=card('Document Fee Configuration',[]);v.appendChild(c);api('GET','/fees').then(function(r){c.appendChild(table(r.d||[],[['Document Type',function(f){return f.documentType}]],function(f){var i=h('input',{type:'number',value:f.fee,style:'width:110px'});return[i,btn('Update Fee',function(){api('PUT','/fees/'+encodeURIComponent(f.documentType),{fee:i.value}).then(done('Fee updated'))},'')]
